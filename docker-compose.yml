services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional. Only start this if you want to exercise the S3 upload path locally:
  #   docker compose --profile s3 up -d
  # Then uncomment the S3_* block in your .env.
  minio:
    image: minio/minio:latest
    profiles: ['s3']
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: payload
      MINIO_ROOT_PASSWORD: payloadpayload
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  createbucket:
    image: minio/mc:latest
    profiles: ['s3']
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 payload payloadpayload; do sleep 1; done;
      mc mb --ignore-existing local/payload-media;
      "

volumes:
  pgdata:
  miniodata:
